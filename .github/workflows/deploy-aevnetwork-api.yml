name: Deploy AevNetwork Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/aevnetwork-api/**"
      - "supabase/functions/fortnite-feed-sync/**"
      - ".github/workflows/deploy-aevnetwork-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aevnetwork-api
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy aevnetwork-api to Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Missing SUPABASE_PROJECT_ID secret"; exit 1; }

      - name: Deploy Edge Function
        run: |
          supabase functions deploy aevnetwork-api --project-ref "$SUPABASE_PROJECT_ID" --yes
          supabase functions deploy fortnite-feed-sync --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --yes
