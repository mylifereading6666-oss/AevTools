name: Deploy AevNetwork Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/aevnetwork-api/**"
      - ".github/workflows/deploy-aevnetwork-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aevnetwork-api
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy aevnetwork-api to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy aevnetwork-api --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"