name: Sync Fortnite official feeds
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-fortnite-official-feeds
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate sync secret
        env:
          SYNC_SECRET: ${{ secrets.FORTNITE_FEED_SYNC_SECRET }}
        run: test -n "$SYNC_SECRET" || { echo "Missing FORTNITE_FEED_SYNC_SECRET repository secret"; exit 1; }
      - name: Fetch official Fortnite sources and sync
        env:
          SYNC_SECRET: ${{ secrets.FORTNITE_FEED_SYNC_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-sync-secret: $SYNC_SECRET" \
            --data '{}' \
            "https://vuqbbwdojwmtehgsyfaq.supabase.co/functions/v1/fortnite-feed-sync"
