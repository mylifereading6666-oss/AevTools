name: Sync FNJPNews feeds
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-fnjpnews.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-fnjpnews-feeds
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate sync secret
        env:
          SYNC_SECRET: ${{ secrets.FORTNITE_FEED_SYNC_SECRET }}
        run: test -n "$SYNC_SECRET" || { echo "Missing FORTNITE_FEED_SYNC_SECRET repository secret"; exit 1; }
      - name: Fetch FNJPNews pages and sync
        env:
          SYNC_SECRET: ${{ secrets.FORTNITE_FEED_SYNC_SECRET }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-sync-secret: $SYNC_SECRET" \
            --data '{"mode":"fnjp"}' \
            "https://vuqbbwdojwmtehgsyfaq.supabase.co/functions/v1/fortnite-feed-sync")"
          echo "$response" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          print(json.dumps(data.get("results", {}), ensure_ascii=False))
          if data.get("ok") is not True:
              print("FNJPNews sync reported errors:", data.get("errors", []), file=sys.stderr)
              sys.exit(1)
          '
